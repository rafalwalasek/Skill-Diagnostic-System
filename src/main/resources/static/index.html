<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skill diagnostic system</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>Skill Diagnostic System</h1>
            <div class="subtitle">Track and improve your skills</div>
        </div>

        <!-- 1. PROGRESS --
        <div class="card">
            <h2>📊 Your Progress</h2>
            <div id="progress">
                <div class="muted">Loading progress...</div>
            </div>
        </div>

        <!-- MAIN INTERACTION -->
        <div class="card">
            <section id="topicsSection"></section>
            <section id="subtopicsSection"></section>
        </div>
        <!-- END MAIN INTERACTION -->

        <!-- 3. RECENT RESULTS --
        <div class="card">
            <h2>📈 Recent Results</h2>
            <div id="recent">
                <div class="muted">Loading recent results...</div>
            </div>
        <!-- </div> -->
    </div>

    <script src="js/app.js"></script>
</body>
</html>
