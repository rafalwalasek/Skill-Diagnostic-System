<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skill diagnostic system</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/addQuestionToDB.css">
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>Skill Diagnostic System</h1>
            <div class="subtitle">Track and improve your skills</div>
        </div>

        <!-- 1. PROGRESS --
        <div class="card">
            <h2>📊 Your Progress</h2>
            <div id="progress">
                <div class="muted">Loading progress...</div>
            </div>
        </div> -->

        <!-- MAIN INTERACTION -->
        <div class="card">
            <section id="topicsSection"></section>
            <section id="subtopicsSection"></section>
            <!-- <button id="trainBtn" disabled>
                Podszkolić ten temat
            </button> -->
        </div>
        <!-- END MAIN INTERACTION -->

        <!-- 3. RECENT RESULTS --
        <div class="card">
            <h2>📈 Recent Results</h2>
            <div id="recent">
                <div class="muted">Loading recent results...</div>
            </div>
        </div> -->

        <!-- ADD QUESTION --
        <div class="card add-question-card">
            <h2>➕ Add Question</h2>
            <form id="questionForm">

                <div class="form-group">
                    <label for="content">Question</label>
                    <textarea id="content" placeholder="Enter question..." required></textarea>
                </div>

                <div class="answers-grid">
                    <div class="form-group">
                        <label for="answerA">Answer A</label>
                        <input type="text" id="answerA" required>
                    </div>
                    <div class="form-group">
                        <label for="answerB">Answer B</label>
                        <input type="text" id="answerB" required>
                    </div>
                    <div class="form-group">
                        <label for="answerC">Answer C</label>
                        <input type="text" id="answerC" required>
                    </div>
                    <div class="form-group">
                        <label for="answerD">Answer D</label>
                        <input type="text" id="answerD" required>
                    </div>
                </div>
                <div class="form-group-correct-answer">
                    <label for="correctAnswer">Correct Answer</label>
                    <select id="correctAnswer">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty">
                            <option value="EASY">Easy</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HARD">Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="JAVA">Java</option>
                            <option value="SPRING">Spring</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Save Question
                </button>
            </form>
        </div><!-- END ADD QUESTION -->

    </div>

    <script src="js/app.js"></script>
    <script src="js/addQuestionToDB.js"></script>
</body>
</html>
